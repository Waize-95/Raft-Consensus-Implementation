services:
  raft1:
    build: .
    container_name: raft1
    ports:
      - "5001:5001"
    volumes:
      - ./d1:/opt/raftkv/d1
    command: >
      ./raftkv --id 1 --port 5001 --peer-port 6001 --data d1 --peers "2@raft2:6002,3@raft3:6003,4@raft4:6004,5@raft5:6005"

  raft2:
    build: .
    container_name: raft2
    ports:
      - "5002:5002"
    volumes:
      - ./d2:/opt/raftkv/d2
    command: >
      ./raftkv --id 2 --port 5002 --peer-port 6002 --data d2 --peers "1@raft1:6001,3@raft3:6003,4@raft4:6004,5@raft5:6005"

  raft3:
    build: .
    container_name: raft3
    ports:
      - "5003:5003"
    volumes:
      - ./d3:/opt/raftkv/d3
    command: >
      ./raftkv --id 3 --port 5003 --peer-port 6003 --data d3 --peers "1@raft1:6001,2@raft2:6002,4@raft4:6004,5@raft5:6005"

  raft4:
    build: .
    container_name: raft4
    ports:
      - "5004:5004"
    volumes:
      - ./d4:/opt/raftkv/d4
    command: >
      ./raftkv --id 4 --port 5004 --peer-port 6004 --data d4 --peers "1@raft1:6001,2@raft2:6002,3@raft3:6003,5@raft5:6005"

  raft5:
    build: .
    container_name: raft5
    ports:
      - "5005:5005"
    volumes:
      - ./d5:/opt/raftkv/d5
    command: >
      ./raftkv --id 5 --port 5005 --peer-port 6005 --data d5 --peers "1@raft1:6001,2@raft2:6002,3@raft3:6003,4@raft4:6004"
